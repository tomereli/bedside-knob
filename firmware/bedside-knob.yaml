            width: 328
            height: 328
            start_angle: 110
            end_angle: 70
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            clickable: false
            arc_width: 10
            arc_color: 0x2C2347
            indicator:
              arc_color: 0xB79BFF
              arc_width: 10
        - label:
            text: "󰾑"
            text_font: mdi_44
            text_color: 0xB79BFF
            align: CENTER
            y: -100
        - label:
            text: "CLOSET"
            text_font: label_28
            text_color: 0x625490
            text_letter_space: 3
            align: CENTER
            y: -56
        - label:
            id: val_clo
            text: "--"
            text_font: value_60
            text_color: 0xB79BFF
            align: CENTER
