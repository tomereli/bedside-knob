        - label:
            text: "󰦡"
            text_font: mdi_44
            text_color: 0x4FE0B0
            align: CENTER
            y: -100
        - label:
            text: "BATH"
            text_font: label_28
            text_color: 0x2E8068
            text_letter_space: 3
            align: CENTER
            y: -56
        - label:
            id: val_bat
            text: "--"
            text_font: value_60
            text_color: 0x4FE0B0
            align: CENTER
            y: 8

    # ---------------- playlist sub-page ----------------
    # Turn walks Home Assistant's list, tap the face plays, and there are
    # two ways back: the BACK button and a hold anywhere.
    - id: page_plist
      bg_color: 0x1A0D12
      on_short_click: [script.execute: on_tap]
      on_long_press: [script.execute: on_hold]
      widgets:
        - label:
            text: "󰲸"
            text_font: mdi_44
            text_color: 0xF06292
            align: CENTER
            y: -110
        - label:
            text: "PLAYLIST"
            text_font: label_18
            text_color: 0x8C4A62
            text_letter_space: 3
            align: CENTER
            y: -66
        - label:
            id: name_pl
            text: "--"
            text_font: label_28
            text_color: 0xF06292
            align: CENTER
            y: -12
            width: 300
            long_mode: DOT
            text_align: CENTER
        - label:
            text: "TAP TO PLAY"
            text_font: label_18
            text_color: 0x8C4A62
            align: CENTER
            y: 34
        - button:
            align: CENTER
            x: 0
            y: 104
            width: 66
            height: 66
            radius: 33
            bg_color: 0x2A141C
            border_width: 3
            border_color: 0x4A2432
            on_short_click:
              - script.execute: screentime
              - lambda: 'id(ui_level) = 0;'
              - script.execute:
                  id: haptic
                  effect: ${fx_out}
              - script.execute: show_page
            widgets:
              - label:
                  text: "󰁍"
                  text_font: mdi_44
                  text_color: 0xCFCFCF
                  align: CENTER

    # ---------------- the idle face ----------------
    # What the glass shows when nobody is touching it, which is almost always.
    # No card, no ring, no value - a tap or a turn leaves it and screentime
    # brings the carousel back where it was.
