# =============================================================================
# bedside-knob - Waveshare ESP32-S3-Knob-Touch-LCD-1.8 / Guition JC3636K518C
#
# PROVENANCE - the hardware half of this file is verbatim from the working
# coffee-knob on identical hardware (github.com/tomereli/coffee-knob), which
# took it from KrX3D/WaveShare-Knob-Esp32S3 @ 5e22f98 and cross-checked it
# against the board schematic. No pin is invented here. The UI architecture
# is the coffee knob's: one fully-styled LVGL page per card, paint before
# show, arc indicator recoloured at runtime, round on-glass buttons.
#   Display QSPI: CLK 13, D0-3 15/16/17/18, CS 14, RST 21   (ST77916)
#   Touch  I2C:   SDA 11, SCL 12, INT 9, RST 10             (CST816 @ 0x15)
#   Haptic I2C:   same bus, DRV2605 @ 0x5A, EN strapped 3V3, TRIG to GND
#   Knob EC1:     A GPIO8, B GPIO7  (EC2 is on the OTHER MCU - not used)
#   Backlight:    GPIO47 (PWM)
#
# INTERACTION
#
#   One flat carousel, no sub-menus to get stuck in:
#     AC - FAN - LIGHTS - SCENES - MUSIC - CLOSET - BATH, wrapping.
#   A turn always moves between cards unless SET is open, so the way out of
#   anything is the gesture the hand is already making.
#
#   LIGHTS carries every zone as a button on the glass - ALL, WAVE, BED,
#   TOM, MASH, READ. Tapping a zone selects it and opens SET; the dial then
#   dims that zone. Holding a zone button toggles it. READ is a pair of
#   relays with no dimmer, so it only toggles.
#
#   SCENES carries the bedside panel's own keys: Good Night, Good Morning,
#   All Off. The knob presses the same keys the hand does.
#
#   MUSIC carries playlist / play-pause / next. The playlist button opens
#   the one sub-page, which has a BACK button and also leaves on a hold.
#
#   SET  the ring and the number turn white; a turn changes the value on the
#        spot. Steps ramp with the run: single detents move 1%, a sustained
#        spin climbs 2/4/7 to 10% per detent, a fast flick doubles that.
#        Tap the face or wait six seconds to leave.
#
#   A tap on a dark screen only wakes, and for 400 ms after the backlight
#   comes up taps are wake-only. Turns are never guarded. Sleep returns the
#   knob to the top level.
#
#   Values go straight to their entities and paint locally before Home
#   Assistant is told. Scene keys are the Vitrea keys themselves and
#   playlists resolve through script.play_playlist_by_name - the house's
#   single name-to-URI map. The playlist names live in an input_select, so
#   changing them is a Home Assistant edit and needs no reflash.
# =============================================================================

substitutions:
  ac_ent:     climate.bedroom_ac
  fan_ent:    fan.master_bedroom_ceiling_fan
  all_ent:    light.home_assistant_connect_zbt_2_bedroom_led_strips
  wave_ent:   light.tzb210_ue01a0s2_ts0502b_3
  beds_ent:   light.tzb210_ue01a0s2_ts0502b
  tomer_ent:  light.tzb210_ue01a0s2_ts0502b_2
  masha_ent:  light.left_nightstand
  # ZHA group 25, exactly the two strips a plain turn may move at night. One
  # multicast instead of two unicasts - the nightstand is the weakest node on
  # this mesh now (LQI 60), and serialised unicasts to a weak node are what
  # dropped commands here before.
  night_ent:  light.living_room_home_assistant_connect_zbt_2_bedroom_lights_night
  read_t_ent: switch.slvn_vknysh_n15_2
  read_m_ent: switch.khdr_shynh_rshy_kh_shynh_qryh_shml
  music_ent:  media_player.master_bedroom_master_bedroom_wiim
  plist_ent:  input_select.bedroom_playlist
  closet_sw:  switch.khdr_shynh_rshy_khdr_rvnvt
  bath_sw:    switch.khdr_rkhtsh_rshy_kh_rkhtsh_rshy_ml
  # Tomer's bedside Vitrea panel (N15).
  key_night:   switch.slvn_vknysh_n15_3
  key_morning: switch.slvn_vknysh_n15_4
  key_alloff:  switch.slvn_vknysh_n15_5
  # The entrance panel's Good Night key; the screen follows it for night
  # dimming instead of a hard-coded hour.
  goodnight_sw: switch.khdr_shynh_rshy_n2_6
  screen_timeout: 20s
  wake_guard_ms: "400"
  # DRV2605 library-6 effects. Short clicks only - the buzz effects are what
  # made the first build rattle.
  fx_detent: "9"    # Soft Bump 30%
  fx_set:    "5"    # Sharp Click 60%
  fx_power:  "4"    # Sharp Click 100%
  fx_out:    "6"    # Sharp Click 30%
  fx_refuse: "13"   # Soft Fuzz 60%

esphome:
  name: bedside-knob
  friendly_name: "Bedside Knob"
  comment: "Nightstand knob - AC, fan, lights, scenes, music"
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L
  on_boot:
    - priority: -100
      then:
        - delay: 2s
        - script.execute: haptic_init
        - script.execute: screentime
        - script.execute: paint_all

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  on_client_connected:
    - delay: 2s
    - script.execute: paint_all
  on_client_disconnected:
    # The idle face is the only thing on the glass most of the night, so it is
    # where a dead link has to show.
    - script.execute: paint_clock

ota:
  - platform: esphome

# The night rule needs a wall clock. Home Assistant's, so the knob and the
# house agree on when 22:00 is. Before the first sync now() is invalid, and
# every night test below reads that as night - the safe direction, and the
# same call the closet knob's automation makes.
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        then:
          - script.execute: paint_clock

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# --- Display: ST77916 over QSPI ---
spi:
  id: display_qspi
  type: quad
  clk_pin: 13
  data_pins: [15, 16, 17, 18]

display:
  - platform: mipi_spi
    id: main_display
    model: JC3636W518V2
    data_rate: 80MHz
    color_order: rgb
    rotation: 0
    cs_pin: 14
    reset_pin: 21
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      height: 360
      width: 360

i2c:
  sda: 11
  scl: 12
  scan: true
  id: ic_bus

touchscreen:
  - platform: cst816
    id: my_touchscreen
    display: main_display
    interrupt_pin: GPIO9
    reset_pin: GPIO10
    transform:
      mirror_x: false
      mirror_y: false
      swap_xy: false
    # LVGL is paused while the glass is dark and sees nothing, so waking on
    # touch has to happen here, below it.
    on_touch:
      - if:
          condition:
            lambda: 'return !id(screen_on);'
          then:
            - script.execute: screentime
            - script.execute: show_page

output:
  - platform: ledc
    pin: GPIO47
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    icon: "mdi:television"
    entity_category: config
    id: back_light
    restore_mode: ALWAYS_OFF
    default_transition_length:
      milliseconds: 30
    on_turn_off:
      # Sleep is also the way out of everything: the knob always wakes at
      # the top level with nothing open.
      - lambda: |-
          id(screen_on) = false;
          id(ui_adjust) = false;
          id(ui_level) = 0;
          // A zone picked in the evening must not still be picked at 3am. An
          // explicit selection escapes the night rule, so leaving it set is a
          // hole the size of the rule itself: one sleepy turn on a stale WAVE
          // selection lights the panel over a sleeping head.
          id(sel_zone) = 0;
      - lvgl.pause:
          show_snow: false
    on_turn_on:
      - lambda: |-
          id(screen_on) = true;
          id(wake_ms) = millis();
      - lvgl.resume:

# Fetched at COMPILE time and baked in; nothing loads at runtime. Montserrat
# Medium because Regular reads thin at 60 px on a dark panel. MDI glyphs are
# literal characters - never escapes - per the flashing notes in HARDWARE.md.
font:
  - file: "gfonts://Montserrat@500"
    id: value_60
    size: 60
  - file: "gfonts://Montserrat@500"
    id: label_28
    size: 28
  - file: "gfonts://Montserrat@500"
    id: label_18
    size: 18
  - file: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_44
    size: 44
    bpp: 4
    glyphs:
      - "󰜗"
      - "󱞗"
      - "󱁑"
      - "󰝚"
      - "󰾑"
      - "󰦡"
      - "󰁍"
      - "󰲸"
      - "󰐎"
      - "󰒭"
      # wifi-off, for the idle face when the link to Home Assistant is down.
      # A glyph missing from this list renders as an empty box, not as nothing.
      - "󰤭"
      - "󰖔"
      - "󰖨"
      - "󰐥"

external_components:
  - source:
      type: git
      url: https://github.com/KrX3D/WaveShare-Knob-Esp32S3
      ref: 5e22f98908f758e38f6412e021554d90234bb5ff
    components: [rotary_encoder_custom]

globals:
  # 0 AC, 1 FAN, 2 LIGHTS, 3 SCENES, 4 MUSIC, 5 CLOSET, 6 BATH
  - id: ui_page
    type: int
    restore_value: false
    initial_value: '0'
  # 0 the carousel, 1 the playlist sub-page
  - id: ui_level
    type: int
    restore_value: false
    initial_value: '0'
  # Which zone the dial dims: 0 ALL, 1 WAVE, 2 BED, 3 TOMER, 4 MASHA.
  # Chosen by tapping its button, never by scrolling through it.
  - id: sel_zone
    type: int
    restore_value: false
    initial_value: '0'
  - id: ui_adjust
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: screen_on
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: wake_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: last_turn_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Detent-to-detent gap and run length, for spin acceleration in SET.
  - id: last_step_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: spin_streak
    type: int
    restore_value: false
    initial_value: '0'
  # Direction of the detent being pushed out right now. The night rule needs
  # it: turning up may wake a dark strip to a glow, turning down may never
  # wake anything, so a downward spin can never light the room.
  - id: turn_up
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: ac_target
    type: float
    restore_value: false
    initial_value: '24.0'
  - id: fan_step
    type: int
    restore_value: false
    initial_value: '0'
  - id: all_pct
    type: int
    restore_value: false
    initial_value: '0'
  - id: wave_pct
    type: int
    restore_value: false
    initial_value: '0'
  - id: beds_pct
    type: int
    restore_value: false
    initial_value: '0'
  - id: tomer_pct
    type: int
    restore_value: false
    initial_value: '0'
  - id: masha_pct
    type: int
    restore_value: false
    initial_value: '0'
  - id: vol_pct
    type: int
    restore_value: false
    initial_value: '0'

sensor:
  - platform: rotary_encoder_custom
    name: "Knob"
    id: knob
    pin_a: GPIO8
    pin_b: GPIO7
    min_value: -30000
    max_value: 30000
    publish_initial_value: true
    restore_mode: ALWAYS_ZERO
    on_clockwise:
      - script.execute:
          id: knob_turn
          delta: 1
    on_anticlockwise:
      - script.execute:
          id: knob_turn
          delta: -1

  # The supply rail, on ADC1 channel 0 - GPIO1. The divider is 2, not the 3 in
  # Waveshare's own note for this board: the coffee knob runs identical
  # hardware and reads 4.80 V on USB with multiply 2.0, and 3.0 here put the
  # same rail at 7.18 V. The working device wins over the datasheet.
  - platform: adc
    pin: GPIO1
    id: vbat
    name: "Supply Voltage"
    entity_category: diagnostic
    update_interval: 10s
    attenuation: 12db
    accuracy_decimals: 2
    unit_of_measurement: "V"
    filters:
      - multiply: 2.0
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 2
    on_value:
      - component.update: batt_level
      - script.execute: paint_clock

  # Lithium discharge curve, taken verbatim from the coffee knob where it is
  # already calibrated against this board. On USB the rail sits near 4.8 V,
  # above the curve's top, so it clamps to 100 - which is why the rail voltage
  # and not this percentage is what tells mains from battery.
  - platform: template
    id: batt_level
    name: "Battery"
    device_class: battery
    entity_category: diagnostic
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      float v = id(vbat).state;
      if (std::isnan(v) || std::isinf(v)) return NAN;
      return v;
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 3.00 -> 0.0
            - 3.50 -> 10.0
            - 3.65 -> 30.0
            - 3.75 -> 50.0
            - 3.90 -> 70.0
            - 4.10 -> 90.0
            - 4.20 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100

  - platform: homeassistant
    id: ha_ac_target
    entity_id: ${ac_ent}
    attribute: temperature
    internal: true
    on_value:
      - lambda: |-
          if (millis() - id(last_turn_ms) > 3000 && !isnan(x)) { id(ac_target) = x; }
      - script.execute: paint_ac

  - platform: homeassistant
    id: ha_ac_current
    entity_id: ${ac_ent}
    attribute: current_temperature
    internal: true
    on_value:
      - script.execute: paint_ac

  - platform: homeassistant
    id: ha_fan_pct
    entity_id: ${fan_ent}
    attribute: percentage
    internal: true
    on_value:
      - lambda: |-
          if (millis() - id(last_turn_ms) > 3000 && !isnan(x)) {
            id(fan_step) = (int) lroundf(x / 16.6667f);
          }
      - script.execute: paint_fan

  - platform: homeassistant
    id: ha_all_bri
    entity_id: ${all_ent}
    attribute: brightness
    internal: true
    on_value:
      - lambda: |-
          if (millis() - id(last_turn_ms) > 3000 && !isnan(x)) {
            id(all_pct) = (int) lroundf(x * 100.0f / 255.0f);
          }
      - script.execute: paint_lights

  - platform: homeassistant
    id: ha_wave_bri
    entity_id: ${wave_ent}
    attribute: brightness
    internal: true
    on_value:
      - lambda: |-
          if (millis() - id(last_turn_ms) > 3000 && !isnan(x)) {
            id(wave_pct) = (int) lroundf(x * 100.0f / 255.0f);
          }
      - script.execute: paint_lights

  - platform: homeassistant
    id: ha_beds_bri
    entity_id: ${beds_ent}
    attribute: brightness
    internal: true
    on_value:
      - lambda: |-
          if (millis() - id(last_turn_ms) > 3000 && !isnan(x)) {
            id(beds_pct) = (int) lroundf(x * 100.0f / 255.0f);
          }
      - script.execute: paint_lights

  - platform: homeassistant
    id: ha_tomer_bri
    entity_id: ${tomer_ent}
    attribute: brightness
    internal: true
    on_value:
      - lambda: |-
          if (millis() - id(last_turn_ms) > 3000 && !isnan(x)) {
            id(tomer_pct) = (int) lroundf(x * 100.0f / 255.0f);
          }
      - script.execute: paint_lights

  - platform: homeassistant
    id: ha_masha_bri
    entity_id: ${masha_ent}
    attribute: brightness
    internal: true
    on_value:
      - lambda: |-
          if (millis() - id(last_turn_ms) > 3000 && !isnan(x)) {
            id(masha_pct) = (int) lroundf(x * 100.0f / 255.0f);
          }
      - script.execute: paint_lights

  - platform: homeassistant
    id: ha_vol
    entity_id: ${music_ent}
    attribute: volume_level
    internal: true
    on_value:
      - lambda: |-
          if (millis() - id(last_turn_ms) > 3000 && !isnan(x)) {
            id(vol_pct) = (int) lroundf(x * 100.0f);
          }
      - script.execute: paint_music

text_sensor:
  - platform: homeassistant
    id: ha_ac_mode
    entity_id: ${ac_ent}
    internal: true
    on_value:
      - script.execute: paint_ac

  - platform: homeassistant
    id: ha_all_st
    entity_id: ${all_ent}
    internal: true
    on_value:
      - script.execute: paint_lights

  - platform: homeassistant
    id: ha_wave_st
    entity_id: ${wave_ent}
    internal: true
    on_value:
      - script.execute: paint_lights

  - platform: homeassistant
    id: ha_beds_st
    entity_id: ${beds_ent}
    internal: true
    on_value:
      - script.execute: paint_lights

  - platform: homeassistant
    id: ha_tomer_st
    entity_id: ${tomer_ent}
    internal: true
    on_value:
      - script.execute: paint_lights

  - platform: homeassistant
    id: ha_masha_st
    entity_id: ${masha_ent}
    internal: true
    on_value:
      - script.execute: paint_lights

  - platform: homeassistant
    id: ha_read_t
    entity_id: ${read_t_ent}
    internal: true
    on_value:
      - script.execute: paint_lights

  - platform: homeassistant
    id: ha_read_m
    entity_id: ${read_m_ent}
    internal: true
    on_value:
      - script.execute: paint_lights

  - platform: homeassistant
    id: ha_music_st
    entity_id: ${music_ent}
    internal: true
    on_value:
      - script.execute: paint_music

  - platform: homeassistant
    id: ha_plist
    entity_id: ${plist_ent}
    internal: true
    on_value:
      - script.execute: paint_plist

  - platform: homeassistant
    id: ha_closet
    entity_id: ${closet_sw}
    internal: true
    on_value:
      - script.execute: paint_closet

  - platform: homeassistant
    id: ha_bath
    entity_id: ${bath_sw}
    internal: true
    on_value:
      - script.execute: paint_bath

  - platform: homeassistant
    id: ha_goodnight
    entity_id: ${goodnight_sw}
    internal: true

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Status"

# --- Haptics: DRV2605 driven directly over I2C ---
# The RAR external component is deliberately not used: its setup() reads a
# status register this chip NACKs, so it bailed before setting LRA mode and
# library 6. Writes work fine, so the registers are driven here.
script:
  - id: haptic_init
    then:
      - lambda: |-
          const uint8_t addr = 0x5A;
          uint8_t mode_run[2] = {0x01, 0x00};
          uint8_t feedback[2] = {0x1A, 0x80};
          uint8_t library[2]  = {0x03, 0x06};
          auto e1 = id(ic_bus)->write(addr, mode_run, 2);
          auto e2 = id(ic_bus)->write(addr, feedback, 2);
          auto e3 = id(ic_bus)->write(addr, library, 2);
          ESP_LOGI("haptic", "DRV2605 init (LRA, lib 6): %d %d %d (0 = OK)",
                   (int) e1, (int) e2, (int) e3);

  - id: haptic
    parameters:
      effect: int
    mode: parallel
    max_runs: 6
    then:
      - lambda: |-
          const uint8_t addr = 0x5A;
          uint8_t w1[2] = {0x04, (uint8_t) effect};
          uint8_t w2[2] = {0x05, 0x00};
          uint8_t go[2] = {0x0C, 0x01};
          id(ic_bus)->write(addr, w1, 2);
          id(ic_bus)->write(addr, w2, 2);
          id(ic_bus)->write(addr, go, 2);

  # The screen no longer goes dark. It goes to the clock, dim, and stays
  # there - the knob is mains-only with no battery, so there is nothing to
  # save by switching it off, and a bedside device that shows the time is
  # worth more idle than black.
  #
  # Everything sleep used to do on the way out still happens here, at the
  # moment the face appears. That matters: the resets used to live in
  # back_light.on_turn_off, and the backlight now never turns off.
  - id: screentime
    mode: restart
    then:
      - lambda: |-
          // Stamp the wake only on the idle -> awake edge, never on an
          // interaction that was already awake. The 400 ms tap guard reads
          // this, so re-stamping it on every turn would swallow every tap.
          if (!id(screen_on)) { id(wake_ms) = millis(); }
          id(screen_on) = true;
      - light.turn_on:
          id: back_light
          brightness: !lambda |-
            return id(ha_goodnight).state == "on" ? 0.25f : 0.85f;
      - script.execute: show_page
      - delay: ${screen_timeout}
      - lambda: |-
          id(screen_on) = false;
          id(ui_adjust) = false;
          id(ui_level) = 0;
          // A zone picked in the evening must not still be picked at 3am. An
          // explicit selection escapes the night rule, so leaving it set is a
          // hole the size of the rule itself: one sleepy turn on a stale WAVE
          // selection lights the panel over a sleeping head.
          id(sel_zone) = 0;
      # The clock is a mains luxury. On the cell the glass goes dark and the
      # knob is only lit when a hand is on it - the cell is a ride-through for
      # a pulled plug, and a face burning through it all night spends the one
      # thing it is there to protect.
      #
      # An unread rail counts as mains: it is NaN only for the first twenty
      # seconds after boot, and the alternative is a knob that looks dead every
      # time it starts.
      - if:
          condition:
            lambda: 'return std::isnan(id(vbat).state) || id(vbat).state > 4.4f;'
          then:
            - script.execute: paint_clock
            - lvgl.page.show: page_clock
            # Far below the 25% the goodnight key already asks for while he is
            # awake. This one is on all night, facing the bed.
            - light.turn_on:
                id: back_light
                brightness: !lambda |-
                  return id(ha_goodnight).state == "on" ? 0.03f : 0.20f;
          else:
            - light.turn_off: back_light

  - id: adjust_timeout
    mode: restart
    then:
      - delay: 6s
      - if:
          condition:
            lambda: 'return id(ui_adjust);'
          then:
            - lambda: 'id(ui_adjust) = false;'
            - script.execute:
                id: haptic
                effect: ${fx_out}
            - script.execute: paint_current

  # ------------------------------------------------------------------------
  # Painting
  # ------------------------------------------------------------------------

  # The idle face. Runs once a minute from the clock, and on any API change.
  - id: paint_clock
    mode: restart
    then:
      - lvgl.label.update:
          id: clk_time
          text: !lambda |-
            static char b[8];
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
            return std::string(b);
      # AMOLED, one static face, every night. The digits walk a four-step box
      # a few pixels wide so no edge sits still long enough to burn in.
      - lvgl.widget.update:
          id: clk_time
          x: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return 0;
            int p = t.minute % 4;
            return (p == 1) ? 7 : (p == 3) ? -7 : 0;
          y: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return 0;
            int p = t.minute % 4;
            return (p == 2) ? 7 : (p == 0) ? -7 : 0;
      # Nothing when the link is up: the absence of a mark is the good state.
      # Asked of the API server itself rather than tracked in a global: the
      # disconnect event fires for any client, so an OTA or a log session
      # dropping would otherwise leave the mark on while Home Assistant is
      # perfectly connected.
      - if:
          condition:
            api.connected:
          then:
            - lvgl.label.update:
                id: clk_link
                text: ""
          else:
            - lvgl.label.update:
                id: clk_link
                text: "󰤭"

  - id: paint_ac
    mode: restart
    then:
      - lvgl.label.update:
          id: val_ac
          text: !lambda |-
            static char b[12];
            if (id(ha_ac_mode).state == "off" || id(ha_ac_mode).state == "unavailable") { return "OFF"; }
            snprintf(b, sizeof(b), "%.1f", id(ac_target));
            return b;
          text_color: !lambda |-
            return lv_color_hex(id(ui_adjust) && id(ui_page) == 0 ? 0xFFFFFF : 0x53B4F5);
      - lvgl.label.update:
          id: sub_ac
          text: !lambda |-
            static char b[12];
            float r = id(ha_ac_current).state;
            if (isnan(r)) { return ""; }
            snprintf(b, sizeof(b), "ROOM %d", (int) lroundf(r));
            return b;
      - lvgl.arc.update:
          id: arc_ac
          value: !lambda |-
            if (id(ha_ac_mode).state == "off") return 0;
            int v = (int) lroundf((id(ac_target) - 16.0f) * 100.0f / 14.0f);
            return v < 0 ? 0 : (v > 100 ? 100 : v);
          indicator:
            arc_color: !lambda |-
              return lv_color_hex(id(ui_adjust) && id(ui_page) == 0 ? 0xFFFFFF : 0x53B4F5);

  - id: paint_fan
    mode: restart
    then:
      - lvgl.label.update:
          id: val_fan
          text: !lambda |-
            static char b[4];
            if (id(fan_step) <= 0) { return "OFF"; }
            snprintf(b, sizeof(b), "%d", id(fan_step));
            return b;
          text_color: !lambda |-
            return lv_color_hex(id(ui_adjust) && id(ui_page) == 1 ? 0xFFFFFF : 0xB8CDD6);
      - lvgl.label.update:
          id: sub_fan
          # Multi-statement on purpose: a single-expression lambda is inlined
          # and .c_str() lands on a const char* (HARDWARE.md, flashing notes).
          text: !lambda |-
            if (id(fan_step) > 0) { return "OF 6"; }
            return "";
      - lvgl.arc.update:
          id: arc_fan
          value: !lambda 'return id(fan_step) * 100 / 6;'
          indicator:
            arc_color: !lambda |-
              return lv_color_hex(id(ui_adjust) && id(ui_page) == 1 ? 0xFFFFFF : 0xB8CDD6);

  # Everything about the lights lives on one card. The name says which zone
  # the dial is pointed at; the buttons below are the whole room.
  - id: paint_lights
    mode: restart
    then:
      - lvgl.label.update:
          id: name_lt
          text: !lambda |-
            switch (id(sel_zone)) {
              case 1:  return "WAVE";
              case 2:  return "BED";
              case 3:  return "TOMER";
              case 4:  return "MASHA";
              default: return "ALL";
            }
      - lvgl.label.update:
          id: val_lt
          text: !lambda |-
            static char b[8];
            int pct; const char* st;
            switch (id(sel_zone)) {
              case 1:  pct = id(wave_pct);  st = id(ha_wave_st).state.c_str();  break;
              case 2:  pct = id(beds_pct);  st = id(ha_beds_st).state.c_str();  break;
              case 3:  pct = id(tomer_pct); st = id(ha_tomer_st).state.c_str(); break;
              case 4:  pct = id(masha_pct); st = id(ha_masha_st).state.c_str(); break;
              default: pct = id(all_pct);   st = id(ha_all_st).state.c_str();   break;
            }
            if (strcmp(st, "on") != 0 || pct <= 0) { return "OFF"; }
            snprintf(b, sizeof(b), "%d%%", pct);
            return b;
          text_color: !lambda |-
            return lv_color_hex(id(ui_adjust) && id(ui_page) == 2 ? 0xFFFFFF : 0xFFB558);
      - lvgl.arc.update:
          id: arc_lt
          value: !lambda |-
            int pct; const char* st;
            switch (id(sel_zone)) {
              case 1:  pct = id(wave_pct);  st = id(ha_wave_st).state.c_str();  break;
              case 2:  pct = id(beds_pct);  st = id(ha_beds_st).state.c_str();  break;
              case 3:  pct = id(tomer_pct); st = id(ha_tomer_st).state.c_str(); break;
              case 4:  pct = id(masha_pct); st = id(ha_masha_st).state.c_str(); break;
              default: pct = id(all_pct);   st = id(ha_all_st).state.c_str();   break;
            }
            return strcmp(st, "on") == 0 ? pct : 0;
          indicator:
            arc_color: !lambda |-
              return lv_color_hex(id(ui_adjust) && id(ui_page) == 2 ? 0xFFFFFF : 0xFFB558);
      # A lit zone gets a lit button. This is the room, read at a glance.
      - lvgl.widget.update:
          id: btn_all
          border_color: !lambda |-
            return lv_color_hex(id(sel_zone) == 0 ? 0xFFFFFF :
                   (id(ha_all_st).state == "on" ? 0xFFB558 : 0x4A340E));
      - lvgl.widget.update:
          id: btn_wave
          border_color: !lambda |-
            return lv_color_hex(id(sel_zone) == 1 ? 0xFFFFFF :
                   (id(ha_wave_st).state == "on" ? 0xFFB558 : 0x4A340E));
      - lvgl.widget.update:
          id: btn_bed
          border_color: !lambda |-
            return lv_color_hex(id(sel_zone) == 2 ? 0xFFFFFF :
                   (id(ha_beds_st).state == "on" ? 0xFFB558 : 0x4A340E));
      - lvgl.widget.update:
          id: btn_tom
          border_color: !lambda |-
            return lv_color_hex(id(sel_zone) == 3 ? 0xFFFFFF :
                   (id(ha_tomer_st).state == "on" ? 0xFFB558 : 0x4A340E));
      - lvgl.widget.update:
          id: btn_mash
          border_color: !lambda |-
            return lv_color_hex(id(sel_zone) == 4 ? 0xFFFFFF :
                   (id(ha_masha_st).state == "on" ? 0xFFB558 : 0x4A340E));
      - lvgl.widget.update:
          id: btn_read
          border_color: !lambda |-
            bool on = id(ha_read_t).state == "on" || id(ha_read_m).state == "on";
            return lv_color_hex(on ? 0xFFB558 : 0x4A340E);

  - id: paint_music
    mode: restart
    then:
      - lvgl.label.update:
          id: val_mus
          text: !lambda |-
            static char b[8];
            snprintf(b, sizeof(b), "%d%%", id(vol_pct));
            return b;
          text_color: !lambda |-
            return lv_color_hex(id(ui_adjust) && id(ui_page) == 4 ? 0xFFFFFF : 0xF06292);
      - lvgl.label.update:
          id: sub_mus
          text: !lambda |-
            if (id(ha_music_st).state == "playing") { return "PLAYING"; }
            if (id(ha_music_st).state == "paused") { return "PAUSED"; }
            if (id(ha_music_st).state == "idle") { return "IDLE"; }
            return "";
      - lvgl.arc.update:
          id: arc_mus
          value: !lambda 'return id(vol_pct);'
          indicator:
            arc_color: !lambda |-
              return lv_color_hex(id(ui_adjust) && id(ui_page) == 4 ? 0xFFFFFF : 0xF06292);

  # Whatever Home Assistant currently has selected, verbatim.
  - id: paint_plist
    mode: restart
    then:
      - lvgl.label.update:
          id: name_pl
          text: !lambda |-
            static char b[48];
            snprintf(b, sizeof(b), "%s", id(ha_plist).state.c_str());
            return b;

  - id: paint_closet
    mode: restart
    then:
      - lvgl.label.update:
          id: val_clo
          text: !lambda |-
            if (id(ha_closet).state == "on") { return "ON"; }
            return "OFF";
      - lvgl.arc.update:
          id: arc_clo
          value: !lambda 'return id(ha_closet).state == "on" ? 100 : 0;'

  - id: paint_bath
    mode: restart
    then:
      - lvgl.label.update:
          id: val_bat
          text: !lambda |-
            if (id(ha_bath).state == "on") { return "ON"; }
            return "OFF";
      - lvgl.arc.update:
          id: arc_bat
          value: !lambda 'return id(ha_bath).state == "on" ? 100 : 0;'

  - id: paint_current
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(ui_level) == 1;'
          then: [script.execute: paint_plist]
          else:
            - if:
                condition:
                  lambda: 'return id(ui_page) == 0;'
                then: [script.execute: paint_ac]
            - if:
                condition:
                  lambda: 'return id(ui_page) == 1;'
                then: [script.execute: paint_fan]
            - if:
                condition:
                  lambda: 'return id(ui_page) == 2;'
                then: [script.execute: paint_lights]
            - if:
                condition:
                  lambda: 'return id(ui_page) == 4;'
                then: [script.execute: paint_music]
            - if:
                condition:
                  lambda: 'return id(ui_page) == 5;'
                then: [script.execute: paint_closet]
            - if:
                condition:
                  lambda: 'return id(ui_page) == 6;'
                then: [script.execute: paint_bath]

  - id: paint_all
    mode: restart
    then:
      - script.execute: paint_ac
      - script.execute: paint_fan
      - script.execute: paint_lights
      - script.execute: paint_music
      - script.execute: paint_plist
      - script.execute: paint_closet
      - script.execute: paint_bath

  - id: show_page
    mode: restart
    then:
      - script.execute: paint_current
      - if:
          condition:
            lambda: 'return id(ui_level) == 1;'
          then: [lvgl.page.show: page_plist]
          else:
            - if:
                condition:
                  lambda: 'return id(ui_page) == 0;'
                then: [lvgl.page.show: page_ac]
            - if:
                condition:
                  lambda: 'return id(ui_page) == 1;'
                then: [lvgl.page.show: page_fan]
            - if:
                condition:
                  lambda: 'return id(ui_page) == 2;'
                then: [lvgl.page.show: page_lights]
            - if:
                condition:
                  lambda: 'return id(ui_page) == 3;'
                then: [lvgl.page.show: page_scenes]
            - if:
                condition:
                  lambda: 'return id(ui_page) == 4;'
                then: [lvgl.page.show: page_music]
            - if:
                condition:
                  lambda: 'return id(ui_page) == 5;'
                then: [lvgl.page.show: page_closet]
            - if:
                condition:
                  lambda: 'return id(ui_page) == 6;'
                then: [lvgl.page.show: page_bath]

  # ------------------------------------------------------------------------
  # Gestures
  # ------------------------------------------------------------------------

  - id: knob_turn
    parameters:
      delta: int
    mode: parallel
    max_runs: 8
    then:
      - script.execute: screentime
      - script.execute:
          id: haptic
          effect: ${fx_detent}
      - if:
          condition:
            lambda: 'return id(ui_adjust);'
          then:
            - script.execute: adjust_timeout
            - lambda: 'id(last_turn_ms) = millis();'
            - script.execute:
                id: value_move
                delta: !lambda 'return delta;'
          else:
            - if:
                condition:
                  lambda: 'return id(ui_level) == 1;'
                then:
                  # Walking Home Assistant's own list, so the knob never
                  # holds a copy of it.
                  - if:
                      condition:
                        lambda: 'return delta > 0;'
                      then:
                        - homeassistant.action:
                            action: input_select.select_next
                            data:
                              entity_id: ${plist_ent}
                      else:
                        - homeassistant.action:
                            action: input_select.select_previous
                            data:
                              entity_id: ${plist_ent}
                else:
                  - lambda: 'id(ui_page) = (id(ui_page) + delta + 7) % 7;'
                  - script.execute: show_page

  # One detent in SET. Percent values accelerate on the RUN, not just the
  # gap: consecutive detents inside 300 ms grow a streak, and the step
  # climbs 1 - 2 - 4 - 7 - 10 as it lengthens. A fast flick doubles it.
  - id: value_move
    parameters:
      delta: int
    mode: parallel
    max_runs: 8
    then:
      - if:
          condition:
            lambda: 'return id(ui_page) == 0;'
          then:
            - lambda: |-
                float t = id(ac_target) + (delta * 0.5f);
                if (t < 16.0f) t = 16.0f;
                if (t > 30.0f) t = 30.0f;
                id(ac_target) = t;
            - script.execute: paint_ac
            - homeassistant.action:
                action: climate.set_temperature
                data:
                  entity_id: ${ac_ent}
                data_template:
                  temperature: "{{ t }}"
                variables:
                  t: !lambda 'return id(ac_target);'
      - if:
          condition:
            lambda: 'return id(ui_page) == 1;'
          then:
            - lambda: |-
                int s = id(fan_step) + delta;
                if (s < 0) s = 0;
                if (s > 6) s = 6;
                id(fan_step) = s;
            - script.execute: paint_fan
            # set_percentage, not increase_speed: the step is decided here so
            # the number on the glass and the fan cannot drift apart. Step 0
            # is how the fan turns off by rotation.
            - homeassistant.action:
                action: fan.set_percentage
                data:
                  entity_id: ${fan_ent}
                data_template:
                  percentage: "{{ p }}"
                variables:
                  p: !lambda 'return id(fan_step) * 100 / 6;'
      - if:
          condition:
            lambda: 'return id(ui_page) == 2;'
          then:
            - lambda: |-
                // 20 points per detent, flat. The closet knob dims these same
                // strips and was tuned to 20 after 10 "took too many detents to
                // get anywhere"; there is no reason for the two knobs on one
                // room to disagree. Five detents cross the range, so no ramp is
                // needed and none is wanted - acceleration on top of 20 would
                // make the dial impossible to place.
                //
                // The floor is 5, not 0: the dial dims toward a glow and never
                // switches a light off. Switching off is the hold gesture, and
                // keeping the two apart is what lets the floor be unconditional.
                id(last_step_ms) = millis();
                int b;
                switch (id(sel_zone)) {
                  case 1:  b = id(wave_pct);  break;
                  case 2:  b = id(beds_pct);  break;
                  case 3:  b = id(tomer_pct); break;
                  case 4:  b = id(masha_pct); break;
                  default: b = id(all_pct);   break;
                }
                b += delta * 20;
                if (b < 5) b = 5;
                if (b > 100) b = 100;
                switch (id(sel_zone)) {
                  case 1:  id(wave_pct) = b;  break;
                  case 2:  id(beds_pct) = b;  break;
                  case 3:  id(tomer_pct) = b; break;
                  case 4:  id(masha_pct) = b; break;
                  default: id(all_pct) = b;   break;
                }
                id(turn_up) = (delta > 0);
            - script.execute: paint_lights
            - script.execute: push_zone
      - if:
          condition:
            lambda: 'return id(ui_page) == 4;'
          then:
            - lambda: |-
                uint32_t now = millis();
                uint32_t dt = now - id(last_step_ms);
                id(last_step_ms) = now;
                if (dt < 300) id(spin_streak)++; else id(spin_streak) = 0;
                int k = id(spin_streak);
                int step = (k < 3) ? 1 : (k < 6) ? 2 : (k < 10) ? 4 : (k < 15) ? 7 : 10;
                if (dt < 60) step *= 2;
                if (step > 15) step = 15;
                int v = id(vol_pct) + delta * step;
                if (v < 0) v = 0;
                if (v > 100) v = 100;
                id(vol_pct) = v;
            - script.execute: paint_music
            - homeassistant.action:
                action: media_player.volume_set
                data:
                  entity_id: ${music_ent}
                data_template:
                  volume_level: "{{ v }}"
                variables:
                  v: !lambda 'return id(vol_pct) / 100.0f;'

  # Zero is off - a dial wound to the floor leaves the light off, not
  # dim-but-on.
  # Between 22:00 and 06:00 a plain turn moves two strips and leaves the other
  # two alone. The Wave lights the whole room and Masha's strip hangs over a
  # sleeping head; neither is reachable from an undirected turn at night. Both
  # stay reachable by selecting the zone, which is a deliberate act - and the
  # selection is wiped on sleep, so it cannot survive the evening.
  - id: push_zone
    mode: restart
    then:
      # Paint has already happened, so the glass is tracking the hand and this
      # delay costs nothing visible. mode:restart means each new detent cancels
      # the pending send, so a whole spin collapses into ONE call once the hand
      # settles instead of one per detent. Without it a fast spin fires up to
      # eight parallel service calls into the mesh and the strips lag badly.
      - delay: 120ms
      # ALL, by day: ONE MULTICAST TO THE GROUP. This must stay a group call.
      # The closet knob learned the hard way that stepping these strips as
      # separate unicasts drops all but the first on this mesh - the fix there
      # was a multicast, and the weak-link diagnosis was wrong.
      - if:
          condition:
            lambda: |-
              auto t = id(ha_time).now();
              return id(sel_zone) == 0 && t.is_valid() && t.hour >= 6 && t.hour < 22;
          then:
            - script.execute:
                id: push_one
                entity: ${all_ent}
                pct: !lambda 'return id(all_pct);'
                st:  !lambda 'return id(ha_all_st).state;'
      # ALL, at night, on the group: a second ZHA group holds exactly the two
      # strips a plain turn may move, so the night path is one multicast too.
      # Safe whenever waking cannot surprise anyone - either the turn is upward
      # and waking is the point, or both members are already lit and there is
      # nothing for move-to-level-with-on-off to switch on.
      - if:
          condition:
            lambda: |-
              auto t = id(ha_time).now();
              bool night = !t.is_valid() || t.hour >= 22 || t.hour < 6;
              if (id(sel_zone) != 0 || !night) return false;
              bool both = id(ha_beds_st).state == "on" && id(ha_tomer_st).state == "on";
              return id(turn_up) || both;
          then:
            - script.execute:
                id: push_one
                entity: ${night_ent}
                pct: !lambda 'return id(all_pct);'
                st:  !lambda |-
                    return (id(ha_beds_st).state == "on" &&
                            id(ha_tomer_st).state == "on")
                           ? std::string("on") : std::string("off");
      # ALL, at night, turning down with one of the two dark: the group would
      # wake the dark one, so only the lit one is written. Still one command.
      - if:
          condition:
            lambda: |-
              auto t = id(ha_time).now();
              bool night = !t.is_valid() || t.hour >= 22 || t.hour < 6;
              if (id(sel_zone) != 0 || !night || id(turn_up)) return false;
              return !(id(ha_beds_st).state == "on" && id(ha_tomer_st).state == "on");
          then:
            - script.execute:
                id: push_one
                entity: ${beds_ent}
                pct: !lambda 'return id(all_pct);'
                st:  !lambda 'return id(ha_beds_st).state;'
            - script.execute:
                id: push_one
                entity: ${tomer_ent}
                pct: !lambda 'return id(all_pct);'
                st:  !lambda 'return id(ha_tomer_st).state;'
      - if:
          condition:
            lambda: 'return id(sel_zone) == 1;'
          then:
            - script.execute:
                id: push_one
                entity: ${wave_ent}
                pct: !lambda 'return id(wave_pct);'
                st:  !lambda 'return id(ha_wave_st).state;'
      - if:
          condition:
            lambda: 'return id(sel_zone) == 2;'
          then:
            - script.execute:
                id: push_one
                entity: ${beds_ent}
                pct: !lambda 'return id(beds_pct);'
                st:  !lambda 'return id(ha_beds_st).state;'
      - if:
          condition:
            lambda: 'return id(sel_zone) == 3;'
          then:
            - script.execute:
                id: push_one
                entity: ${tomer_ent}
                pct: !lambda 'return id(tomer_pct);'
                st:  !lambda 'return id(ha_tomer_st).state;'
      - if:
          condition:
            lambda: 'return id(sel_zone) == 4;'
          then:
            - script.execute:
                id: push_one
                entity: ${masha_ent}
                pct: !lambda 'return id(masha_pct);'
                st:  !lambda 'return id(ha_masha_st).state;'

  # One strip, one absolute target. Absolute rather than brightness_step_pct:
  # a relative step asks the bulb to move itself, and the weakest of these
  # applied a fraction of each request and drifted out of sync. A computed
  # target that lands is exact, and one that is lost is corrected by the next
  # detent rather than accumulating wrong.
  #
  # This never turns a light off. The dial floors at 5% and dims toward a glow;
  # off is the hold gesture. And it never wakes a dark strip on a downward
  # turn, at any hour, so a downward spin can never light the room.
  - id: push_one
    parameters:
      entity: string
      pct: int
      st: string
    mode: parallel
    max_runs: 8
    then:
      - if:
          condition:
            lambda: 'return st == "on" || id(turn_up);'
          then:
            - homeassistant.action:
                action: light.turn_on
                data_template:
                  entity_id: "{{ e }}"
                  brightness_pct: "{{ p }}"
                variables:
                  e: !lambda 'return entity;'
                  # Waking a dark strip at night brings it up at a glow rather
                  # than jumping to the full step, so the first thing a hand
                  # finds in the dark is not the room at 80%.
                  p: !lambda |-
                      auto t = id(ha_time).now();
                      bool night = !t.is_valid() || t.hour >= 22 || t.hour < 6;
                      if (st != "on" && night) return 5;
                      int p = pct;
                      if (p < 5) p = 5;
                      if (p > 100) p = 100;
                      return p;

  # Tapping a zone button points the dial at it and opens SET in one act.
  - id: pick_zone
    parameters:
      z: int
    mode: restart
    then:
      - script.execute: screentime
      - if:
          condition:
            lambda: 'return millis() - id(wake_ms) > $wake_guard_ms;'
          then:
            - lambda: |-
                id(sel_zone) = z;
                id(ui_adjust) = true;
                id(last_step_ms) = 0;
                id(spin_streak) = 0;
            - script.execute:
                id: haptic
                effect: ${fx_set}
            - script.execute: adjust_timeout
            - script.execute: paint_lights

  - id: toggle_zone
    parameters:
      z: int
    mode: restart
    then:
      - script.execute: screentime
      - lambda: 'id(sel_zone) = z;'
      - script.execute:
          id: haptic
          effect: ${fx_power}
      - if:
          condition:
            lambda: 'return z == 0;'
          then:
            - homeassistant.action:
                action: light.toggle
                data:
                  entity_id: ${all_ent}
      - if:
          condition:
            lambda: 'return z == 1;'
          then:
            - homeassistant.action:
                action: light.toggle
                data:
                  entity_id: ${wave_ent}
      - if:
          condition:
            lambda: 'return z == 2;'
          then:
            - homeassistant.action:
                action: light.toggle
                data:
                  entity_id: ${beds_ent}
      - if:
          condition:
            lambda: 'return z == 3;'
          then:
            - homeassistant.action:
                action: light.toggle
                data:
                  entity_id: ${tomer_ent}
      - if:
          condition:
            lambda: 'return z == 4;'
          then:
            - homeassistant.action:
                action: light.toggle
                data:
                  entity_id: ${masha_ent}
      - script.execute: paint_lights

  # Both reading relays move together: they are one lamp per side of the
  # same bed and nobody reaches for exactly one of them from here.
  - id: toggle_read
    mode: restart
    then:
      - script.execute: screentime
      - if:
          condition:
            lambda: 'return millis() - id(wake_ms) > $wake_guard_ms;'
          then:
            - script.execute:
                id: haptic
                effect: ${fx_power}
            - if:
                condition:
                  lambda: |-
                    return id(ha_read_t).state == "on" || id(ha_read_m).state == "on";
                then:
                  - homeassistant.action:
                      action: switch.turn_off
                      data:
                        entity_id: ${read_t_ent}
                  - homeassistant.action:
                      action: switch.turn_off
                      data:
                        entity_id: ${read_m_ent}
                else:
                  - homeassistant.action:
                      action: switch.turn_on
                      data:
                        entity_id: ${read_t_ent}
                  - homeassistant.action:
                      action: switch.turn_on
                      data:
                        entity_id: ${read_m_ent}

  # Press one of the bedside panel's own keys.
  - id: press_key
    parameters:
      entity: string
    mode: restart
    then:
      - script.execute: screentime
      - if:
          condition:
            lambda: 'return millis() - id(wake_ms) > $wake_guard_ms;'
          then:
            - script.execute:
                id: haptic
                effect: ${fx_power}
            - homeassistant.action:
                action: switch.turn_on
                data_template:
                  entity_id: "{{ e }}"
                variables:
                  e: !lambda 'return entity;'

  - id: play_plist
    mode: restart
    then:
      # The script sets shuffle itself before building the queue, so there
      # is deliberately no shuffle call here.
      - homeassistant.action:
          action: script.play_playlist_by_name
          data:
            player: ${music_ent}
          data_template:
            playlist: "{{ p }}"
          variables:
            p: !lambda 'return id(ha_plist).state;'

  - id: toggle_set
    mode: restart
    then:
      - lambda: |-
          id(ui_adjust) = !id(ui_adjust);
          id(last_step_ms) = 0;
          id(spin_streak) = 0;
      - script.execute:
          id: haptic
          effect: !lambda 'return id(ui_adjust) ? ${fx_set} : ${fx_out};'
      - if:
          condition:
            lambda: 'return id(ui_adjust);'
          then: [script.execute: adjust_timeout]
      - script.execute: paint_current

  # Tap on the face itself, not on a button.
  - id: on_tap
    mode: restart
    then:
      - script.execute: screentime
      - if:
          condition:
            lambda: 'return millis() - id(wake_ms) > $wake_guard_ms;'
          then:
            - if:
                condition:
                  lambda: 'return id(ui_level) == 1;'
                then:
                  - script.execute:
                      id: haptic
                      effect: ${fx_power}
                  - script.execute: play_plist
                  - lambda: 'id(ui_level) = 0;'
                  - script.execute: show_page
                else:
                  - if:
                      condition:
                        lambda: |-
                          return id(ui_page) == 0 || id(ui_page) == 1 ||
                                 id(ui_page) == 2 || id(ui_page) == 4;
                      then:
                        - script.execute: toggle_set
                  - if:
                      condition:
                        lambda: 'return id(ui_page) == 5;'
                      then:
                        - script.execute:
                            id: haptic
                            effect: ${fx_power}
                        - homeassistant.action:
                            action: switch.toggle
                            data:
                              entity_id: ${closet_sw}
                  - if:
                      condition:
                        lambda: 'return id(ui_page) == 6;'
                      then:
                        - script.execute:
                            id: haptic
                            effect: ${fx_power}
                        - homeassistant.action:
                            action: switch.toggle
                            data:
                              entity_id: ${bath_sw}

  - id: on_hold
    mode: restart
    then:
      - script.execute: screentime
      - if:
          condition:
            lambda: 'return id(ui_level) == 1;'
          then:
            # Second way out of the playlist page, besides its BACK button.
            - lambda: 'id(ui_level) = 0;'
            - script.execute:
                id: haptic
                effect: ${fx_out}
            - script.execute: show_page
          else:
            - lambda: 'id(ui_adjust) = false;'
            - if:
                condition:
                  lambda: 'return id(ui_page) == 0;'
                then:
                  - script.execute:
                      id: haptic
                      effect: ${fx_power}
                  - homeassistant.action:
                      action: climate.toggle
                      data:
                        entity_id: ${ac_ent}
            - if:
                condition:
                  lambda: 'return id(ui_page) == 1;'
                then:
                  - script.execute:
                      id: haptic
                      effect: ${fx_power}
                  - homeassistant.action:
                      action: fan.toggle
                      data:
                        entity_id: ${fan_ent}
            - if:
                condition:
                  lambda: 'return id(ui_page) == 2;'
                then:
                  - script.execute:
                      id: toggle_zone
                      z: !lambda 'return id(sel_zone);'
            - if:
                condition:
                  lambda: 'return id(ui_page) == 4;'
                then:
                  - script.execute:
                      id: haptic
                      effect: ${fx_power}
                  - homeassistant.action:
                      action: media_player.media_play_pause
                      data:
                        entity_id: ${music_ent}
            - if:
                condition:
                  lambda: 'return id(ui_page) == 3 || id(ui_page) >= 5;'
                then:
                  - script.execute:
                      id: haptic
                      effect: ${fx_refuse}

# =============================================================================
# FACE - one page per card, each with its own background, icon and colour.
# Ring r = 160 stroke 10 inside the 172 safe radius. LIGHTS, SCENES and MUSIC
# carry round on-glass buttons, the coffee knob's idiom.
# =============================================================================
lvgl:
  id: my_lvgl
  displays: [main_display]
  touchscreens:
    - touchscreen_id: my_touchscreen
      long_press_time: 700ms
  color_depth: 16
  buffer_size: 24%
  bg_color: 0x000000
  # USB-C end is the top when plugged in for power. mipi_spi reports hardware
  # rotation, so LVGL does this in the panel, not on the CPU.
  rotation: 180
  pages:
    # ---------------- AC - cold blue ----------------
    - id: page_ac
      bg_color: 0x0A1420
      on_short_click: [script.execute: on_tap]
      on_long_press: [script.execute: on_hold]
      widgets:
        - arc:
            id: arc_ac
            align: CENTER
            width: 328
            height: 328
            start_angle: 110
            end_angle: 70
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            clickable: false
            arc_width: 10
            arc_color: 0x16324A
            indicator:
              arc_color: 0x53B4F5
              arc_width: 10
        - label:
            text: "󰜗"
            text_font: mdi_44
            text_color: 0x53B4F5
            align: CENTER
            y: -100
        - label:
            text: "AC"
            text_font: label_28
