                    - homeassistant.action:
                        action: media_player.media_play_pause
                        data:
                          entity_id: ${music_ent}
            widgets:
              - label:
                  text: "󰐎"
                  text_font: mdi_44
                  text_color: 0xF06292
                  align: CENTER
        - button:
            align: CENTER
            x: 78
            y: 70
            width: 66
            height: 66
            radius: 33
            bg_color: 0x2A141C
            border_width: 3
            border_color: 0x4A2432
            on_short_click:
