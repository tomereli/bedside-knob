                    - script.execute: show_page
            widgets:
              - label:
                  text: "󰲸"
                  text_font: mdi_44
                  text_color: 0xF06292
                  align: CENTER
        - button:
            align: CENTER
            x: 0
            y: 70
            width: 66
            height: 66
            radius: 33
            bg_color: 0x2A141C
            border_width: 3
            border_color: 0x4A2432
            on_short_click:
              - script.execute: screentime
              - if:
