<meta charset="utf-8"><title>Idle</title><style>
*{box-sizing:border-box}
body{margin:0;background:#0a0a0a;color:#6f6a66;
     font:14px/1.5 'Segoe UI',system-ui,Arial,sans-serif;
     display:flex;flex-direction:column;align-items:center;
     justify-content:center;min-height:100vh;padding:32px;gap:22px}
.face{width:360px;height:360px;display:block;border-radius:50%;
      background:#000;box-shadow:0 0 0 9px #131211,0 0 0 11px #23201d,
                 0 22px 60px rgba(0,0,0,.9)}
.face text{font-family:'Montserrat','Segoe UI',Arial,Helvetica,sans-serif}
.cap{max-width:430px;text-align:center;font-size:13px;color:#7d7772}
.cap b{color:#c9a37a;font-weight:600;display:block;margin-bottom:5px;
       font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.note{font-size:11px;color:#4a4643;max-width:430px;text-align:center}
</style>
<svg class="face" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg"><circle cx="180" cy="180" r="180" fill="#000000"/></svg>
<p class="cap"><b>Idle</b>20 s after the last touch. Not dimmed - off. The only thing 150 mm from a sleeping face is nothing.</p>
<p class="note">360 x 360 on a 45.7 mm circle. Night palette: no channel above 0x80,
no blue at all. Shown here about twice life size on a 96 dpi screen.</p>
